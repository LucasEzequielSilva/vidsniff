<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>VidSniff</title>
</head>
<body>
  <header>
    <div class="logo">
      <img src="icons/icon.svg" alt="VidSniff" width="24" height="24">
      <h1>VidSniff</h1>
      <span id="streamCount" class="stream-count" hidden></span>
    </div>
    <div class="header-actions">
      <button id="refresh" class="btn-icon" title="Rescan page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
      <button id="copyAll" class="btn-small" title="Copy all URLs">Copy All</button>
    </div>
  </header>

  <div id="streams"></div>

  <div id="empty" class="empty" hidden>
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <p>No streams detected on this page</p>
    <p class="hint">Try playing a video or refreshing the page</p>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
